[tool.poetry]
name = "tesouro_direto_br"
version = "0.3.5"
description = "Gerenciamento da Carteira de Titulos Publicos Federais com dados do Tesouro Direto"
authors = ["Rafael Rodrigues <rafael.rafarod@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rafa-rod/tesouro_direto_br"
homepage = "https://github.com/rafa-rod/tesouro_direto_br"
keywords = ["tesouro-direto", "titulos-publicos", "renda-fixa", "carteira",
            "marcacao-a-mercado", "finance", "brasil", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
packages = [
    { include = "tesouro_direto_br", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.10"
pandas = ">=2.2.3"
numpy = ">=1.26.0"
requests = "^2.31"
matplotlib = ">=3.10.0"
pyettj = ">=0.4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^6.0.0"
twine = ">=6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
branch = true
source = ["src/tesouro_direto_br"]

[tool.coverage.report]
show_missing = true
ignore_errors = true
omit = ["tests/*"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if .debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
markers = [
    "network: testes que requerem conexão com a internet",
]
